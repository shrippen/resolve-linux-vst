# Public mirror: Gitea pushes every branch and tag here on each commit.
# This builds and tests and reports the result back to the commit on Gitea
# as the status "github / test", where the pull requests live. Tags v*
# also build the release archive and attach it to the GitHub release
# (install.sh downloads it from there).
#
# Not here, because it needs DaVinci Resolve: resolve-linux-vst check (the
# hooks in the installed Resolve) and the end-to-end tests in the README
# (editor-test with real plug-ins, rendering with AAC). Run them locally.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the
# repository (commit statuses).
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]

# No concurrency group: every commit runs to the end and keeps its own
# status, a newer push does not cancel an older run.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/resolve-linux-vst/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - run: make -j"$(nproc)" CXXFLAGS="-O2 -g -Wall -Wextra -Werror"
      - run: make test
      - run: bash -n resolve-linux-vst install.sh start.sh

  # Also runs when test failed or was cancelled, so Gitea never keeps a
  # stale "pending".
  report:
    needs: test
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          case "$RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          desc=$RESULT
          if [ -n "$STARTED" ]; then desc="$RESULT in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RESULT: ${{ needs.test.result }}
          STARTED: ${{ needs.test.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

  # Release archive: the oldest Ubuntu runner keeps glibc low (2.35), so the
  # library loads on older distributions too. Resolve brings its own libs.
  release:
    needs: test
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      # The release notes are the tag's section in CHANGELOG.md (## [X.Y.Z], ## X.Y.Z or
      # ## vX.Y.Z). No section, no release: the job fails instead of posting a placeholder.
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { if (found) exit
                     t = $2
                     if (t ~ /^\[.*\]$/) t = substr(t, 2, length(t) - 2)
                     if (t ~ /^v/) t = substr(t, 2)
                     if (t == v) { found = 1; next } }
            found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $v"
            exit 1
          fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - name: Build archive
        run: |
          make -j"$(nproc)" dist VERSION="${GITHUB_REF_NAME#v}" MAKEFLAGS=-j"$(nproc)"
          cp "build/dist/resolve-linux-vst-${GITHUB_REF_NAME#v}-x86_64.tar.gz" resolve-linux-vst-x86_64.tar.gz
          sha256sum resolve-linux-vst-x86_64.tar.gz > resolve-linux-vst-x86_64.tar.gz.sha256
      # GitHub gets the notes from CHANGELOG.md, the archive and the FFmpeg
      # sources of its AAC decoder (LGPL: source from the same place as the binary).
      - name: Attach to the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "resolve-linux-vst ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            resolve-linux-vst-x86_64.tar.gz resolve-linux-vst-x86_64.tar.gz.sha256 \
            build/dist/ffmpeg-6.0.tar.xz tools/ffmpeg-binutils.patch
        env:
          GH_TOKEN: ${{ github.token }}
